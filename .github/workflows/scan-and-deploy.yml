name: Scan US selloffs and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "2-57/5 * * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh alert data
        run: python scanner.py

      - name: Refresh Sequential multi-timeframe data
        run: python sequential.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
