name: Scan US selloffs and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "3-53/10 * * * 1-5"

env:
  RECENT_SIGNAL_BARS: "5"
  BINANCE_TOP_USDT_PAIRS: "40"
  PREMARKET_ABNORMAL_PCT: "2.0"
  PREMARKET_MAX_MOVERS: "12"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Do not use GitHub Pages' reserved deployment group, and never interrupt a
  # scan that is already building the next site version.
  group: kj-radar-scan-deploy
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh alert data
        run: python scanner.py

      - name: Refresh market pulse data
        run: python market_pulse.py

      - name: Refresh Sequential multi-timeframe data
        run: python sequential.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
