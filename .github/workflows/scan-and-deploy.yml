name: Refresh KJ Radar TD data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub's five-minute minimum cadence keeps Taiwan's 09:00 and the US
    # 09:30 opening reclaims close to the first available daily quote.  The
    # browser polls the published snapshot every 15 seconds after deployment.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * 1-5"

env:
  RECENT_SIGNAL_BARS: "8"
  # Monitor the 200 highest 24-hour-notional Binance USDⓈ-M USDT perpetuals.
  BINANCE_FUTURES_TOP_USDT_PERPETUALS: "200"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Do not use GitHub Pages' reserved deployment group, and never interrupt a
  # scan that is already building the next site version.
  group: kj-radar-scan-deploy
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    # Allow temporary upstream data-source slowness without killing a valid
    # scan before it reaches the Pages deployment step.
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh market pulse data
        id: market_pulse
        continue-on-error: true
        run: python market_pulse.py

      - name: Preserve last market snapshot if a public source fails
        if: ${{ steps.market_pulse.outcome == 'failure' }}
        run: |
          echo "::warning::Market pulse refresh failed; deploying the last committed market snapshot instead."
          test -s data/market.json

      - name: Refresh Sequential multi-timeframe data
        run: python sequential.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # A re-run of the same workflow has a new run_attempt.  Keep its
          # artifact separate so deploy-pages never sees duplicate candidates.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
