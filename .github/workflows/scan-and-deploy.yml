name: Scan US selloffs and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # A complete multi-market scan plus Pages deployment can take several
    # minutes.  Thirty-minute spacing prevents scheduled runs from queuing
    # behind one another and leaving a newer site version undeployed.
    - cron: "7,37 * * * 1-5"

env:
  RECENT_SIGNAL_BARS: "5"
  BINANCE_TOP_USDT_PAIRS: "40"
  PREMARKET_ABNORMAL_PCT: "2.0"
  PREMARKET_MAX_MOVERS: "12"
  CHIP_RADAR_HISTORY_DAYS: "25"
  CHIP_RADAR_TOP_CANDIDATES: "30"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Do not use GitHub Pages' reserved deployment group, and never interrupt a
  # scan that is already building the next site version.
  group: kj-radar-scan-deploy
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    # Allow temporary upstream data-source slowness without killing a valid
    # scan before it reaches the Pages deployment step.
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Taiwan sentiment history
        uses: actions/cache/restore@v4
        with:
          path: data/taiwan_sentiment_history.json
          key: taiwan-sentiment-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            taiwan-sentiment-${{ github.ref_name }}-

      - name: Restore chip radar history
        uses: actions/cache/restore@v4
        with:
          path: data/chip_radar_history.json
          key: chip-radar-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chip-radar-${{ github.ref_name }}-

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh alert data
        run: python scanner.py

      - name: Refresh market pulse data
        run: python market_pulse.py

      - name: Save Taiwan sentiment history
        if: ${{ always() && hashFiles('data/taiwan_sentiment_history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/taiwan_sentiment_history.json
          key: taiwan-sentiment-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh Sequential multi-timeframe data
        run: python sequential.py

      - name: Refresh Taiwan chip radar data
        run: python chip_radar.py

      - name: Save chip radar history
        if: ${{ always() && hashFiles('data/chip_radar_history.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/chip_radar_history.json
          key: chip-radar-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove private cache files from Pages artifact
        if: ${{ always() }}
        run: rm -f data/taiwan_sentiment_history.json data/chip_radar_history.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # A re-run of the same workflow has a new run_attempt.  Keep its
          # artifact separate so deploy-pages never sees duplicate candidates.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
